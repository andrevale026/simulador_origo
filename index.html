<style>
/* ===============================
   Variáveis de Cores Futuristas
================================ */
:root {
    --bg-dark: #05050a;
    --bg-gradient: radial-gradient(circle at top center, #1a0b2e 0%, #05050a 100%);
    --neon-cyan: #00f3ff;
    --neon-purple: #bc13fe;
    --neon-green: #00ff9d;
    --neon-red: #ff0055;
    
    --glass-bg: rgba(20, 20, 30, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
}

/* ===============================
   Reset e Global
================================ */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg-dark);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Grelha de fundo (Cyber-grid) */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
    pointer-events: none;
}

/* ===============================
   Header e Logo
================================ */
.header {
    text-align: center;
    padding: 30px 20px 20px 20px;
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header-logo {
    max-width: 180px;
    height: auto;
    margin-bottom: 20px;
    border-radius: 50%;
    border: 2px solid var(--neon-purple);
    box-shadow: 0 0 20px rgba(188, 19, 254, 0.5);
    animation: pulse-glow 3s infinite alternate;
}

@keyframes pulse-glow {
    0% { box-shadow: 0 0 15px rgba(188, 19, 254, 0.6); border-color: var(--neon-purple); }
    100% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.8); border-color: var(--neon-cyan); }
}

.header h1 {
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 3px;
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 3rem);
    margin: 0 0 10px 0;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(188, 19, 254, 0.5);
}

.titulo-branco { color: #ffffff; }
.titulo-roxo { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }

.subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(1rem, 1.5vw, 1.2rem);
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* ===============================
   Container e Cards (Glassmorphism)
================================ */
.main-wrapper {
    width: 100%;
    max-width: 1400px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.layout-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 30px;
    width: 100%;
    max-width: 500px;
    transition: all 0.3s ease;
}

@media (min-width: 900px) {
    .layout-grid {
        grid-template-columns: 1fr 1fr;
        max-width: 1200px;
        align-items: start;
    }
}

.card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 30px;
    box-shadow: var(--glass-shadow);
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
}

.card h3 {
    font-family: 'Rajdhani', sans-serif;
    color: var(--neon-purple);

    font-size: 1.8rem;

    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(188, 19, 254, 0.3);

    align-items: center;
    gap: 10px;

/* ===============================
   Labels e Inputs Futuristas
================================ */
label {

    font-size: 1.1rem;
    color: var(--neon-cyan);
    margin-top: 20px;
    margin-bottom: 8px;
    display: block;
    font-weight: 600;
    letter-spacing: 1px;
}

input, select {
    width: 100%;
    padding: 16px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 243, 255, 0.2);
    border-radius: 8px;
    color: #ffffff;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
    -webkit-appearance: none;
    appearance: none;
}

input:focus, select:focus {
    outline: none;
    border-color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    background: rgba(0, 0, 0, 0.8);
}

input::placeholder {
    color: rgba(255, 255, 255, 0.2);
}

select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2300f3ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");

}

select option {

}

option.consultor-destaque {

}

input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ===============================
   Botões Cyberpunk
================================ */
button {
    margin-top: 30px;

    padding: 18px 20px;
    border: 1px solid var(--neon-purple);

button:hover {

button:active {

#btnPdf {

/* ===============================
   Switch de GD Própria
================================ */
.switch-line {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 10px;
    margin-bottom: 15px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.2rem;

}

.switch-line .nao { color: var(--neon-red); }
.switch-line .sim { color: var(--neon-green); text-shadow: 0 0 10px rgba(0,255,157,0.5); }

.switch {
    position: relative;
    width: 60px;
    height: 30px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 30px;
    transition: .3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.slider:before {
    content: "";
    position: absolute;
    height: 22px;
    width: 22px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: .3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
}

input:checked + .slider {
    background: rgba(0, 255, 157, 0.2);
    border-color: var(--neon-green);
}

input:checked + .slider:before {
    transform: translateX(30px);
    background: var(--neon-green);
    box-shadow: 0 0 15px var(--neon-green);
}

/* ===============================
   Estilos de Resultados e Linhas
================================ */
.row {

/* ===============================
   Mensagens de Erro
================================ */

    box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
}

.hidden { display: none !important; }

#pdf-content {
    display: none;
}
</style>
</head>

    Script Lógico Corrigido

<script>
document.addEventListener("DOMContentLoaded", () => {

    const $ = id => document.getElementById(id);
    const moneyFields = document.querySelectorAll(".money");
    const moneyNegativeFields = document.querySelectorAll(".money-negative");
    const priceFields = document.querySelectorAll(".price6");
    const fields = document.querySelectorAll(".field");
    const formatter = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let timeoutId;
    function formatMoneyInput(el, decimals){
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
            let v = el.value.replace(/\D/g, "");
            if (v) el.value = (parseInt(v) / Math.pow(10, decimals)).toFixed(decimals).replace(".", ",");
            else el.value = "";
        }, 50);
    }

    function formatMoneyNegativeInput(el, decimals){
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
            let isNegative = el.value.startsWith('-');
            let v = el.value.replace(/[^\d]/g, "");
            if (v) {
                let formattedValue = (parseInt(v) / Math.pow(10, decimals)).toFixed(decimals).replace(".", ",");
                el.value = (isNegative ? '-' : '') + formattedValue;
            } else el.value = isNegative ? '-' : '';
        }, 50);
    }

    moneyFields.forEach(i => i.addEventListener("input", () => formatMoneyInput(i, 2)));
    moneyNegativeFields.forEach(i => i.addEventListener("input", () => formatMoneyNegativeInput(i, 2)));
    priceFields.forEach(i => i.addEventListener("input", () => formatMoneyInput(i, 6)));

    document.addEventListener("keydown", e => {
        if(e.key === "Enter"){
            const atual = document.activeElement;
            const index = [...fields].indexOf(atual);
            if(index !== -1){
                e.preventDefault();
                if (index < fields.length - 1) fields[index + 1].focus();
                else calcular();
            }
        }
    });

    $("toggleGD").addEventListener("change", e => {
        if(e.target.checked){
            $("possuiGD").value = "SIM";
            $("campoGD").classList.remove("hidden");
            if (!$("precoInjecaoGD").value) $("precoInjecaoGD").value = "0,986600";
            setTimeout(() => $("energiagd").focus(), 300);
        } else {
            $("possuiGD").value = "NAO";
            $("campoGD").classList.add("hidden");
        }
    });

    $("btnSimular").addEventListener("click", calcular);
    $("btnPdf").addEventListener("click", gerarPDF);

    function moeda(v){
        if (!v || v === '-' || v.trim() === '') return 0;
        let isNegative = v.toString().trim().startsWith('-');
        let numericPart = v.toString().replace(/^-/, '').replace(/\./g, '').replace(',', '.');
        let number = parseFloat(numericPart) || 0;
        return isNegative ? -Math.abs(number) : Math.abs(number);
    }

    function getDadosConsultor() {
        const select = $('consultor');
        const selectedOption = select.options[select.selectedIndex];
        return {
            nome: selectedOption.value || selectedOption.text,
            telefone: selectedOption.getAttribute('data-telefone') || '',
            link: selectedOption.getAttribute('data-link') || ''
        };
    }

    function dataAtual(){ return new Date().toLocaleDateString("pt-BR"); }

    function calcular(){
        const consultorSelect = $("consultor");
        
        // Se nenhum consultor foi selecionado, seleciona automaticamente a primeira opção válida para evitar travamento
        if(!consultorSelect.value){
            if (consultorSelect.options.length > 1) {
                consultorSelect.selectedIndex = 1;
            }
        }

        const consultor = consultorSelect.value;
        $("erroConsultor").classList.add("hidden");

        const possuiGD = $("possuiGD").value;
        const rede = $("rede").value;
        const consumo = Math.abs(Number($("consumo").value)) || 0;
        const energiagd = possuiGD === "SIM" ? Math.abs(Number($("energiagd").value)) || 0 : 0;
        const valorunit = moeda($("valorunit").value);
        const adicional = moeda($("adicional").value);
        const iluminacao = moeda($("iluminacao").value);
        const outros = moeda($("outros").value); 
        const desc = Number($("desc").value) || 0;

        const tensao = rede === "M" ? 30 : rede === "B" ? 50 : 100;
        const tarifacomp = possuiGD === "SIM" ? (moeda($("precoInjecaoGD").value) || 0.986600) : 0.986600;

        const consumototal = consumo * valorunit;
        const gdpropria = energiagd * tarifacomp * -1 
        const total_energisa = consumototal + gdpropria + adicional + iluminacao + outros;

        const consumorigo = Math.max(0, consumo - energiagd - tensao);
        const valorunit2 = valorunit + (consumo > 0 ? adicional / consumo : 0);
        const boletocheio = consumorigo * valorunit2;
        const descorigo = (boletocheio * desc / 100) * -1;
        const compimpostos = (valorunit - tarifacomp) * consumorigo * -1;

        const total_energisa_origo = (consumototal - energiagd) - (consumorigo * tarifacomp) + adicional + iluminacao + outros;
        const total_origo = boletocheio + descorigo + compimpostos;

        const total_mes = total_energisa - (total_origo + total_energisa_origo);
        const total_ano = total_mes * 12;

        const dadosConsultor = getDadosConsultor();

                    <div class="row"><span>Bandeiras</span><span>R$ ${formatter.format(adicional)}</span></div>
                    <div class="row"><span>Iluminação Pública</span><span>R$ ${formatter.format(iluminacao)}</span></div>
                    <div class="row"><span>Outros</span><span>R$ ${formatter.format(outros)}</span></div>
                    <div class="total neon-orange">
                        <span>💰 Total Fatura</span>

                    </div>
                </div>

                <div class="card" style="width: 100%;">
                    <div class="neon-purple" style="font-size: 1rem; margin-bottom: 10px;">🌱 Economia Órigo Energia</div>
                    <div class="row"><span><strong>Total Fatura Distribuidora</strong></span><span><strong>R$ ${formatter.format(total_energisa_origo)}</strong></span></div>
                    <div class="row"><span>Créditos Injetados</span><span>R$ ${formatter.format(boletocheio)}</span></div>
                    <div class="row"><span>Desconto do Plano Órigo</span><span>R$ ${formatter.format(descorigo)}</span></div>
                    <div class="row"><span>Compensação de Impostos</span><span>R$ ${formatter.format(compimpostos)}</span></div>
                    <div class="row"><span><strong>Total Fatura Órigo</strong></span><span><strong>R$ ${formatter.format(total_origo)}</strong></span></div>
                    <div class="total neon-purple">
                        <span>📊 TOTAL MENSAL</span>
                        <span>R$ ${formatter.format(total_origo + total_energisa_origo)}</span>
                    </div>
                </div>

                <div class="card center" style="width: 100%; text-align: center; background: rgba(20, 15, 35, 0.85); border-color: var(--neon-green);">
                    <div class="economia-mensal">💰 ECONOMIA MENSAL<br>R$ ${formatter.format(total_mes)}</div>
                    <div class="economia-anual">🎯 ECONOMIA ANUAL<br>R$ ${formatter.format(total_ano)}</div>
                </div>

                <div class="consultor-card">
                    <div class="consultor-nome">👤 ${dadosConsultor.nome}</div>
                    <div class="consultor-telefone">📞 ${dadosConsultor.telefone || 'Telefone não disponível'}</div>
                    ${dadosConsultor.link ?
                        `<a href="${dadosConsultor.link}" target="_blank" class="consultor-botao" rel="noopener noreferrer">
                            🚀 PEÇA SEU DESCONTO
                        </a>
                        <div class="consultor-link-curto">${dadosConsultor.link}</div>`
                        : '<div style="color: #999; padding: 8px; font-size: 12px;">Link indisponível</div>'}
                </div>

                <div class="assinatura">
                    Simulação feita pelo(a) executivo(a)<br>
                    <span class="branco">${consultor}</span> em <span class="branco">${dataAtual()}</span>
                </div>

                <div class="creditos">Design by André Leonardo Vale | 2026</div>
            </div>
        `;

        output.innerHTML = htmlResultados;
        
        const pdfTemplateClean = `
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; font-family: Arial, sans-serif; color: #000; background: #fff; padding: 10px;">
                <div style="width: 100%; max-width: 380px; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 15px; margin: 0 auto;">
                    <div style="color: #d97706; font-weight: 700; font-size: 1rem; margin-bottom: 8px;">🏢 Cenário Atual – Distribuidora</div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #eee;"><span>Consumo</span><span>R$ ${formatter.format(consumototal)}</span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #eee;"><span>Energia GD Própria</span><span>R$ ${formatter.format(gdpropria)}</span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #eee;"><span>Bandeiras</span><span>R$ ${formatter.format(adicional)}</span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #eee;"><span>Iluminação Pública</span><span>R$ ${formatter.format(iluminacao)}</span></div>

                    <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #eee;"><span><strong>Total Fatura Distribuidora</strong></span><span><strong>R$ ${formatter.format(total_energisa_origo)}</strong></span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #eee;"><span>Créditos Injetados</span><span>R$ ${formatter.format(boletocheio)}</span></div>

                    <div style="color: #4b0082; font-size: 16px; font-weight: 700; margin: 5px 0;">💰 ECONOMIA MENSAL<br>R$ ${formatter.format(total_mes)}</div>
                    <div style="color: #000; font-size: 24px; font-weight: 700; margin: 5px 0;">🎯 ECONOMIA ANUAL<br>R$ ${formatter.format(total_ano)}</div>
                </div>

                <div style="width: 100%; max-width: 380px; background: #fff; border: 2px solid #7a00cc; border-radius: 12px; padding: 12px; text-align: center; margin: 0 auto;">
                    <div style="color: #4b0082; font-size: 15px; font-weight: 700; margin-bottom: 4px;">👤 ${dadosConsultor.nome}</div>
                    <div style="color: #14532d; font-size: 13px; font-weight: 600; margin-bottom: 6px;">📞 ${dadosConsultor.telefone || 'Telefone não disponível'}</div>
                    ${dadosConsultor.link ? `<div style="font-size: 8px; color: #666; word-break: break-all; padding: 4px; background: #f5f5f5; border-radius: 4px;">${dadosConsultor.link}</div>` : ''}
                </div>

                <div style="text-align: center; font-size: 11px; color: #ff0000; font-weight: 600; margin-top: 5px;">
                    Simulação feita pelo(a) executivo(a)<br>
                    <span style="color: #000;">${consultor}</span> em <span style="color: #000;">${dataAtual()}</span>
                </div>

                <div style="text-align: center; font-size: 9px; color: #4b0082; font-weight: 600; margin-top: 2px;">Design by André Leonardo Vale | 2026</div>
            </div>
        `;

        $("pdf-content").innerHTML = pdfTemplateClean;

        setTimeout(() => outputContainer.scrollIntoView({behavior: "smooth", block: "start"}), 100);
    }

    function gerarPDF(){
        const element = document.getElementById('pdf-content');
        element.style.display = 'block';

        const opt = {
            margin: [3, 3, 3, 3],
            filename: `Simulacao_Origo_${new Date().toLocaleDateString().replace(/\//g, '_')}.pdf`,
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: {
                scale: 1.4,
                scrollY: 0,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                allowTaint: false,
                foreignObjectRendering: false
            },
            jsPDF: {
                unit: 'mm',
                format: 'a4',
                orientation: 'portrait'
            }
        };

        const btnPdf = $("btnPdf");
        const originalText = btnPdf.textContent;
        btnPdf.textContent = "📄 GERANDO PDF...";
        btnPdf.disabled = true;

        html2pdf().set(opt).from(element).save()
            .then(() => {
                element.style.display = 'none';
                btnPdf.textContent = originalText;
                btnPdf.disabled = false;
            })
            .catch(error => {
                console.error('Erro ao gerar PDF:', error);
                alert('Erro ao gerar PDF. Tente novamente.');
                element.style.display = 'none';
                btnPdf.textContent = originalText;
                btnPdf.disabled = false;
            });
    }

    document.querySelectorAll('button, a').forEach(el => {
        el.addEventListener('contextmenu', e => e.preventDefault());
    });

});
</script>
